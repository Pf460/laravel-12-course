services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "php artisan migrate --force && exec apache2-foreground"]
    ports:
      - "8080:80"
    volumes:
      - ../backend:/var/www/html
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
